[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voc-label-agent"
version = "0.1.0"
description = "A small, evaluation-first VOC labeling agent with human review routing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "myjiji4"}]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest>=6.2", "jsonschema>=3.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
